version: 2

# One Dependabot pull request a week for the whole repository: npm and the
# GitHub Actions together (a multi-ecosystem group). Titles and commits use
# the `deps` scope from scopes.json for every kind of dependency
# (Dependabot's own `include: scope` would write `deps-dev`, not a scope
# here). `commit-message` sits on the group: Dependabot rejects it on an
# update that belongs to a multi-ecosystem group.
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps)"

updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies

  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: dependencies
