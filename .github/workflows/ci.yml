name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main, "integration/**"]

# The reusable workflow only reads the repository.
permissions:
  contents: read

jobs:
  ci:
    uses: tuxery/.github/.github/workflows/ci-web.yml@d31579f042cf78a25d34c729966ddf91f59c38be # main @ 2026-08-13
    with:
      working-directory: .
      node-version: "26"

  # `pnpm audit-matching --check`: builds the dataset from the source caches
  # and fails when a golden product (config/audit-golden.json) is split
  # across cards, shares a card with another, or lost an anchor package.
  # Needs the private caches (src/sources/_shared/cache-path.ts): most
  # golden products anchor on a Flathub or Snap package. Read on the runner
  # only: nothing is uploaded, and the log shows only the golden file's own
  # anchors and the ids of the groups holding them.
  #
  # Skipped on Dependabot's PRs (a re-run by someone else included) and on
  # PRs from forks, which get no Pushinator key: Dependabot only sees
  # Dependabot secrets, which hold none on purpose, so updated dependencies
  # never run with read access to the private caches. Without them the
  # check would only report every private anchor as missing.
  golden:
    name: Golden matching check
    if: >-
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "26"

      - name: Mint a read-only token for the private source caches
        id: pushinator
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.2.0 @ 2026-10-02
        with:
          client-id: ${{ vars.PUSHINATOR_ID || secrets.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}
          repositories: source-cache
          permission-contents: read

      - name: Check out the private source caches
        uses: actions/checkout@v7
        with:
          repository: tuxery/source-cache
          token: ${{ steps.pushinator.outputs.token }}
          path: source-cache-private
          persist-credentials: false

      - name: Check the golden products
        env:
          TUXERY_PRIVATE_CACHE_DIR: ${{ github.workspace }}/source-cache-private/cache
        run: pnpm audit-matching --check

  # src/store/store-contract.json must be byte for byte app's
  # src/store-contract.json: store-contract.spec.ts pins publish() to this
  # copy, app's tests pin catalog.ts to that one. A contract change goes on
  # same-named branches in both repos, so this compares with app's branch of
  # this PR's name when it exists (then its base, then the pushed branch),
  # and app's main otherwise. app is public: the default token reads it.
  store-contract:
    name: Store contract matches app's
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Compare with app's copy
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          ref=main
          for candidate in "$HEAD_REF" "$BASE_REF" "$REF_NAME"; do
            if [ -n "$candidate" ] && git ls-remote --exit-code --heads https://github.com/tuxery/app.git "$candidate" > /dev/null; then
              ref=$candidate
              break
            fi
          done
          echo "Comparing with app's $ref"
          gh api -H "Accept: application/vnd.github.raw" \
            "repos/tuxery/app/contents/src/store-contract.json?ref=$ref" > "$RUNNER_TEMP/app-store-contract.json"
          if ! diff -u "$RUNNER_TEMP/app-store-contract.json" src/store/store-contract.json; then
            echo "::error file=src/store/store-contract.json::differs from app's src/store-contract.json on $ref: change both, on same-named branches"
            exit 1
          fi
