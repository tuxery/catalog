name: Publish dataset to Turso

# Publishes are incremental since 2026-10-12 (src/store/incremental.ts):
# only the rows that changed are written, ~206k rows for a dataset where
# nearly every app changed against ~1.74M for a full rebuild. The note
# below dates from full rebuilds only.
#
# Manual-only, on purpose (2026-09-03): this used to auto-publish on
# every PR (to preview) and every merge to main (to prod), but each
# publish does a full 168k-row bulk insert plus a from-scratch rebuild of
# all 9 indexes — real write volume, not free. Turso's write quota got
# burned fast once this was combined with the classification work's
# commit cadence (multiple PRs/merges a day, each triggering a full
# reseed) on top of the read-quota incident from the same week. Kept as
# workflow_dispatch so a publish is still one click away, just never
# automatic. Re-enable the pull_request/push triggers (see git history
# for the exact `on:` block) once there's a real signal for how often a
# publish is actually needed rather than firing on every PR/merge
# regardless of whether the dataset meaningfully changed.
#
# `pnpm seed` never hits a real upstream source regardless of trigger —
# it only rebuilds dist/dataset.json from the git-committed
# src/sources/cache/*.ndjson and pushes the result to Turso. See
# catalog/AGENTS.md's Local dev section for what --preview/--prod
# actually do. There is no hosted "Turso dev" DB — local dev emulates a
# local SQLite file instead (`pnpm seed`/`pnpm serve`, no flag), so this
# workflow only ever targets preview or prod.
#
# Secrets are repo-level (PREVIEW_*/PROD_* prefixed) rather than scoped to
# the `preview`/`prod` Environments below, even though each job still
# declares its Environment (for the deployment-history view in the GitHub
# UI) — the token used to provision this repo only had the "Secrets"
# permission, not "Environments", so Environment-scoped secrets couldn't
# be set from here. Revisit if that's ever fixed: rename back to
# TURSO_DB_URL/TURSO_DB_AUTH_TOKEN under each Environment's own secret
# store instead.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Which database to publish to"
        required: true
        type: choice
        options:
          - preview
          - prod
      full:
        description: "Rebuild every table and index (pnpm seed --full) instead of writing only what changed"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish-preview:
    if: github.event.inputs.target == 'preview'
    name: Publish to Turso preview
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "26"

      # The private caches (src/sources/_shared/cache-path.ts): without
      # them `pnpm seed` refuses to publish rather than dropping their apps.
      - name: Mint a token for the private source caches
        id: pushinator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 @ 2026-10-02
        with:
          client-id: ${{ vars.PUSHINATOR_ID || secrets.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}
          repositories: source-cache
          permission-contents: read

      - name: Check out the private source caches
        uses: actions/checkout@v7
        with:
          repository: tuxery/source-cache
          token: ${{ steps.pushinator.outputs.token }}
          path: source-cache-private

      - name: Seed Turso preview
        env:
          TUXERY_PRIVATE_CACHE_DIR: ${{ github.workspace }}/source-cache-private/cache
          TURSO_DB_URL: ${{ secrets.PREVIEW_TURSO_DB_URL }}
          TURSO_DB_AUTH_TOKEN: ${{ secrets.PREVIEW_TURSO_DB_AUTH_TOKEN }}
        run: pnpm seed --preview ${{ inputs.full && '--full' || '' }}

  publish-prod:
    if: github.event.inputs.target == 'prod'
    name: Publish to Turso prod
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "26"

      # The private caches (src/sources/_shared/cache-path.ts): without
      # them `pnpm seed` refuses to publish rather than dropping their apps.
      - name: Mint a token for the private source caches
        id: pushinator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 @ 2026-10-02
        with:
          client-id: ${{ vars.PUSHINATOR_ID || secrets.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}
          repositories: source-cache
          permission-contents: read

      - name: Check out the private source caches
        uses: actions/checkout@v7
        with:
          repository: tuxery/source-cache
          token: ${{ steps.pushinator.outputs.token }}
          path: source-cache-private

      - name: Seed Turso prod
        env:
          TUXERY_PRIVATE_CACHE_DIR: ${{ github.workspace }}/source-cache-private/cache
          TURSO_DB_URL: ${{ secrets.PROD_TURSO_DB_URL }}
          TURSO_DB_AUTH_TOKEN: ${{ secrets.PROD_TURSO_DB_AUTH_TOKEN }}
        run: pnpm seed --prod ${{ inputs.full && '--full' || '' }}
