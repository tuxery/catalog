name: Publish dataset — R2

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  publish:
    name: Rebuild & publish dataset
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
    steps:
      - uses: actions/checkout@v7

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "24"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm -r build

      - name: Test
        run: pnpm -r test

      # @tuxery/rebuild falls back to a local dry-run write when the R2_*
      # secrets/vars above aren't set — no-ops safely until they're
      # configured on this repository, same precedent as
      # CLOUDFLARE_API_TOKEN in tuxery/app's deploy.yml.
      - name: Rebuild & publish dataset
        run: pnpm --filter @tuxery/rebuild start
