name: Refresh source caches

# Weekly, not daily — most upstream repodata itself doesn't change that
# often, and this repo pays for every refresh in real git history (every
# run diffs and commits src/sources/cache/*.ndjson). Saturday, not a
# weekday: this is a hobby project worked on evenings/weekends, and a
# refresh PR that needs a fix (flaky mirror, upstream layout change) is
# more likely to get attention promptly on a Saturday morning than a
# Monday one buried under the work week.
on:
  schedule:
    - cron: "0 4 * * 6"
  workflow_dispatch:
    inputs:
      source:
        description: "Refresh only this source (leave empty to refresh all)"
        required: false

# One source's fetch failing (a flaky mirror, a temporary 5xx, an upstream
# repodata layout change) shouldn't block every other source's refresh —
# each one is fetched and committed independently, same "no single point
# of failure across sources" principle the catalog itself is built on.
jobs:
  refresh:
    name: Refresh
    runs-on: ubuntu-latest
    # 30 was too tight: this workflow has never once completed since it
    # was added (all 3 scheduled runs, 2026-09-05/12/19, killed at ~30min)
    # — snap-snapcraft's recursive category+prefix sweep alone (~4k
    # requests against a public API with no full-catalog dump, see its
    # own fetch.ts comments) took 21+ minutes by itself on the last run,
    # before the job died partway through lutris, never reaching
    # github-releases or the "Open a PR" step at all.
    timeout-minutes: 60
    # The default GITHUB_TOKEN only reads here: this org forbids it from
    # creating pull requests ("GitHub Actions is not permitted to create or
    # approve pull requests", every scheduled run since 2026-09-05), and the
    # fix is the Pushinator GitHub App's token below, not loosening that
    # org-wide setting (which would also let any workflow *approve* PRs).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # First, before the ~30-minute refresh: a missing/misconfigured app
      # (secrets not set, app not installed on this repo) should fail in
      # seconds, not after every source has been fetched for nothing.
      # Needs PUSHINATOR_ID (the app's Client ID, from its settings page;
      # not actually secret, so it may be an org variable rather than a
      # secret: both are read) and the secret PUSHINATOR_KEY (a generated
      # private key, full PEM), and the app installed on this repo with
      # Contents + Pull requests: write.
      - name: Mint a token from the Pushinator GitHub App
        id: pushinator
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0 @ 2026-10-02
        with:
          client-id: ${{ vars.PUSHINATOR_ID || secrets.PUSHINATOR_ID }}
          private-key: ${{ secrets.PUSHINATOR_KEY }}
          permission-contents: write
          permission-pull-requests: write
          # tuxery/source-cache holds the caches that must not be public
          # (src/sources/_shared/cache-path.ts): the app needs to be
          # installed there too, with the same permissions.
          repositories: catalog,source-cache

      # The private caches, checked out inside the workspace but committed
      # to their own repository (last step). Never print their content:
      # this repository's run logs are public.
      - name: Check out the private source caches
        uses: actions/checkout@v7
        with:
          repository: tuxery/source-cache
          token: ${{ steps.pushinator.outputs.token }}
          path: source-cache-private

      - uses: helpers4/action/setup-pnpm@6fddd178620e7325d446a246c38a44f979569fc4 # main @ 2026-07-29
        with:
          node-version: "26"

      - name: Refresh source caches
        env:
          TUXERY_PRIVATE_CACHE_DIR: ${{ github.workspace }}/source-cache-private/cache
          # AppImage's version-resolution step and the GitHub Releases
          # source's own search+lookup both use this — 5000 req/hr vs. 60
          # unauthenticated (see docs/sources.md's AppImage/GitHub Releases
          # notes); skipped gracefully, not a hard failure, when unset.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail

          if [ -n "${{ github.event.inputs.source }}" ]; then
            sources="${{ github.event.inputs.source }}"
          else
            sources=$(pnpm exec tsx src/sources/refresh.ts --list)
          fi

          failed=""
          for source in $sources; do
            echo "::group::Refreshing $source"
            if ! pnpm exec tsx src/sources/refresh.ts "$source"; then
              echo "::warning::$source refresh failed — cache left at its last successful state"
              failed="$failed $source"
            fi
            echo "::endgroup::"
          done

          if [ -n "$failed" ]; then
            echo "::warning::Sources that failed to refresh:$failed"
          fi

      # New and changed apps get their LLM verdict (app/game/library/other)
      # in the same PR as the caches, instead of waiting for a manual
      # multi-day run. The queue is incremental (only apps without an
      # entry), so a weekly refresh means a few requests: capped at 20
      # (Gemini's free tier allows ~20/day per model) and never waiting
      # for a resting model. Skipped, not failed, without GEMINI_API_KEY;
      # a failed run leaves the caches PR untouched.
      - name: Classify new apps with the LLM
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TUXERY_PRIVATE_CACHE_DIR: ${{ github.workspace }}/source-cache-private/cache
        run: |
          set -o pipefail
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "::notice::GEMINI_API_KEY not set, skipping classify-llm"
            exit 0
          fi
          pnpm exec tsx scripts/classify-llm.ts --max-requests 20 --max-idle 0 2>&1 | tee classify.log
          {
            echo "### LLM classification"
            echo '```'
            grep -E "^(Queue|To classify|Done|Stopped|  [a-z0-9.-]+: [0-9]+ requests)" classify.log || true
            echo '```'
          } > classify-summary.md

      - name: Write the PR body
        run: |
          {
            echo 'Automated weekly refresh of `src/sources/cache/*.ndjson`, plus LLM'
            echo 'verdicts for the apps it adds (`config/llm-classifications.json`).'
            echo 'See the "Refresh source caches" workflow run for any sources'
            echo 'that failed to refresh (left at their last successful state,'
            echo 'not blocking the others).'
            echo
            cat classify-summary.md 2>/dev/null || echo "LLM classification skipped or failed, see the run log."
          } > pr-body.md

      # main is branch-protected (PR + rebase only, org-wide since the
      # PoC exit) -- a scheduled bot can't push straight to it, so this
      # opens a PR the same way a human would, rather than assuming a
      # bypass that isn't actually configured. Authored as the Pushinator
      # app; unlike a PR opened with GITHUB_TOKEN, that also triggers CI.
      - name: Open a PR with the updated caches
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 @ 2026-04-10
        with:
          token: ${{ steps.pushinator.outputs.token }}
          commit-message: "chore(sources): 🔧 scheduled source cache refresh"
          title: "chore(sources): scheduled source cache refresh"
          body-path: pr-body.md
          branch: chore/scheduled-source-refresh
          delete-branch: true
          add-paths: |
            src/sources/cache/
            config/llm-classifications.json

      # Same weekly PR, in the private repository, for its caches.
      - name: Open a PR with the updated private caches
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1 @ 2026-04-10
        with:
          token: ${{ steps.pushinator.outputs.token }}
          path: source-cache-private
          commit-message: "chore(sources): 🔧 scheduled private source cache refresh"
          title: "chore(sources): scheduled private source cache refresh"
          body: 'Automated weekly refresh of the private caches (`cache/*.ndjson`), opened by tuxery/catalog''s "Refresh source caches" workflow.'
          branch: chore/scheduled-source-refresh
          delete-branch: true
          add-paths: |
            cache/
